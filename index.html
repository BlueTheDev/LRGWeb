<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRG - Product Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-1: #1e3c72;
            --bg-gradient-2: #2a5298;
            --bg-gradient-3: #7e22ce;
            --bg-gradient-4: #3b82f6;
            --card-bg: rgba(26, 41, 64, 0.7);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #60a5fa;
        }

        [data-theme="light"] {
            --bg-gradient-1: #f0f9ff;
            --bg-gradient-2: #e0f2fe;
            --bg-gradient-3: #bae6fd;
            --bg-gradient-4: #7dd3fc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-primary: #1e293b;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.1);
            --accent-color: #3b82f6;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(-45deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3), var(--bg-gradient-4));
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: var(--text-primary);
            min-height: 100vh;
            transition: all 0.3s;
        }

        .theme-toggle {
            position: relative;
            width: 60px;
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--border-color);
        }

        .theme-toggle::before {
            content: '🌙';
            position: absolute;
            top: 50%;
            left: 4px;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            background: var(--text-primary);
            border-radius: 50%;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        [data-theme="light"] .theme-toggle::before {
            content: '☀️';
            left: 34px;
        }

        .navbar {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            animation: slideIn 0.6s ease;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            animation: float 3s ease-in-out infinite;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-primary);
            text-decoration: none;
            transition: all 0.3s;
            position: relative;
            cursor: pointer;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-color);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: var(--accent-color);
        }

        .user-info {
            background: rgba(96, 165, 250, 0.15);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(96, 165, 250, 0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }

        .user-info:hover {
            background: rgba(96, 165, 250, 0.25);
            transform: scale(1.02);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-color);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .welcome-section {
            margin-bottom: 3rem;
            animation: fadeIn 0.8s ease;
        }

        .welcome-section h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .welcome-section p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeIn 0.6s ease;
        }

        .product-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(96, 165, 250, 0.3);
            border-color: rgba(96, 165, 250, 0.5);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border-bottom: 1px solid var(--border-color);
            transition: transform 0.3s;
        }

        .product-card:hover .product-image {
            transform: scale(1.1);
        }

        .product-content {
            padding: 1.5rem;
        }

        .product-title {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .product-description {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
        }

        .purchase-btn {
            flex: 1;
            padding: 0.8rem;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .purchase-btn:disabled {
            background: rgba(107, 114, 128, 0.5);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .purchase-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s;
        }

        .purchase-btn:not(:disabled):hover::before {
            left: 100%;
        }

        .purchase-btn:not(:disabled):hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }

        .download-btn {
            flex: 1;
            padding: 0.8rem;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4);
        }

        .discord-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #5865F2 0%, #4752C4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .discord-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(88, 101, 242, 0.4);
        }

        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            max-width: 450px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.8s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .login-card h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            animation: float 3s ease-in-out infinite;
        }

        .login-card p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .theme-toggle-login {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
        }

        .hidden {
            display: none;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: scale(1.05);
        }

        .no-products {
            text-align: center;
            padding: 4rem 2rem;
            animation: fadeIn 0.8s ease;
        }

        .no-products h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .no-products p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .owned-badge {
            display: inline-block;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .admin-table {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .admin-table th,
        .admin-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .admin-table th {
            background: rgba(96, 165, 250, 0.15);
            font-weight: 600;
            color: var(--accent-color);
        }

        .admin-table td {
            color: var(--text-primary);
        }

        .admin-table tr:hover {
            background: rgba(96, 165, 250, 0.05);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-verified {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status-pending {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h1>👋 Hey!</h1>
            <p>Welcome to LRG Portal</p>
            <div class="theme-toggle-login">
                <div class="theme-toggle" onclick="toggleTheme()"></div>
            </div>
            <button class="discord-btn" onclick="loginWithDiscord()">
                <svg width="24" height="24" viewBox="0 0 71 55" fill="none">
                    <path d="M60.1045 4.8978C55.5792 2.8214 50.7265 1.2916 45.6527 0.41542C45.5603 0.39851 45.468 0.440769 45.4204 0.525289C44.7963 1.6353 44.105 3.0834 43.6209 4.2216C38.1637 3.4046 32.7345 3.4046 27.3892 4.2216C26.905 3.0581 26.1886 1.6353 25.5617 0.525289C25.5141 0.443589 25.4218 0.40133 25.3294 0.41542C20.2584 1.2888 15.4057 2.8186 10.8776 4.8978C10.8384 4.9147 10.8048 4.9429 10.7825 4.9795C1.57795 18.7309 -0.943561 32.1443 0.293408 45.3914C0.299005 45.4562 0.335386 45.5182 0.385761 45.5576C6.45866 50.0174 12.3413 52.7249 18.1147 54.5195C18.2071 54.5477 18.305 54.5139 18.3638 54.4378C19.7295 52.5728 20.9469 50.6063 21.9907 48.5383C22.0523 48.4172 21.9935 48.2735 21.8676 48.2256C19.9366 47.4931 18.0979 46.6 16.3292 45.5858C16.1893 45.5041 16.1781 45.304 16.3068 45.2082C16.679 44.9293 17.0513 44.6391 17.4067 44.3461C17.471 44.2926 17.5606 44.2813 17.6362 44.3151C29.2558 49.6202 41.8354 49.6202 53.3179 44.3151C53.3935 44.2785 53.4831 44.2898 53.5502 44.3433C53.9057 44.6363 54.2779 44.9293 54.6529 45.2082C54.7816 45.304 54.7732 45.5041 54.6333 45.5858C52.8646 46.6197 51.0259 47.4931 49.0921 48.2228C48.9662 48.2707 48.9102 48.4172 48.9718 48.5383C50.038 50.6034 51.2554 52.5699 52.5959 54.435C52.6519 54.5139 52.7526 54.5477 52.845 54.5195C58.6464 52.7249 64.529 50.0174 70.6019 45.5576C70.6551 45.5182 70.6887 45.459 70.6943 45.3942C72.1747 30.0791 68.2147 16.7757 60.1968 4.9823C60.1772 4.9429 60.1437 4.9147 60.1045 4.8978Z" fill="currentColor"/>
                </svg>
                Login with Discord
            </button>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="hidden">
        <nav class="navbar">
            <div class="logo">🏢 LRG</div>
            <div class="nav-links">
                <a onclick="showHome()">Home</a>
                <a onclick="showProducts()">My Products</a>
                <a id="adminNavLink" class="hidden" onclick="showAdmin()">Admin Panel</a>
                <div class="theme-toggle" onclick="toggleTheme()"></div>
                <div class="user-info">
                    <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
                    <span id="userInfo"></span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>
        </nav>

        <div class="container">
            <!-- Home Section -->
            <div id="homeSection">
                <div class="welcome-section">
                    <h1>👋 Hey, <span id="userName"></span>!</h1>
                    <p>Welcome back! Check out our products.</p>
                </div>
                <div class="products-grid" id="allProductsGrid"></div>
            </div>

            <!-- My Products Section -->
            <div id="productsSection" class="hidden">
                <div class="welcome-section">
                    <h1>📦 My Products</h1>
                    <p>Products you own and can download</p>
                </div>
                <div id="ownedProductsContainer"></div>
            </div>

            <!-- Admin Panel -->
            <div id="adminSection" class="hidden">
                <div class="welcome-section">
                    <h1>⚙️ Admin Panel</h1>
                    <p>Manage users and licenses</p>
                </div>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Discord ID</th>
                            <th>Products Owned</th>
                            <th>Registered</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <tr><td colspan="5" style="text-align: center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '1457730077046603907';
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const BLOXLINK_API_KEY = '6458e379-4c87-40b8-82a3-6043938751c9';
        
        const ADMIN_USERS = ['blueesworld', '.poke'];
        
        const PRODUCTS = [
            {
                id: 'furniture-pack',
                name: 'Furniture Pack',
                emoji: '🪑',
                description: 'Comprehensive furniture collection for stylish interiors. Contains modern and functional designs for every room.',
                gamepassUrl: 'https://www.roblox.com/game-pass/970395648',
                gamepassId: '970395648'
            },
            {
                id: 'travel-system',
                name: 'Travel System',
                emoji: '🚗',
                description: 'Innovative travel system for seamless mobility. Perfect for dynamic environments and fast movement.',
                gamepassUrl: 'https://www.roblox.com/game-pass/970396147',
                gamepassId: '970396147'
            },
            {
                id: 'restaurant-bundle',
                name: 'Restaurant Bundle',
                emoji: '🍽️',
                description: 'Complete restaurant package with everything you need. From kitchen equipment to dining furniture.',
                gamepassUrl: 'https://www.roblox.com/game-pass/970396397',
                gamepassId: '970396397'
            },
            {
                id: 'basic-bundle',
                name: 'LRG Basic Bundle',
                emoji: '📦',
                description: 'The perfect starter package for your business. Contains all basic features for a successful start.',
                gamepassUrl: 'https://www.roblox.com/game-pass/970396675',
                gamepassId: '970396675'
            },
            {
                id: 'upgrade-bundle',
                name: 'LRG Upgrade Bundle',
                emoji: '⬆️',
                description: 'Advanced features and premium functions for experienced users. Take your experience to the next level.',
                gamepassUrl: null,
                gamepassId: null
            }
        ];

        let currentUser = null;
        let currentView = 'home';

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        window.onload = async function() {
            loadTheme();
            
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');
            
            if (accessToken) {
                await handleDiscordCallback(accessToken);
                return;
            }

            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                await loadUserData();
                showMainApp();
            }
        };

        function loginWithDiscord() {
            const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            window.location.href = authUrl;
        }

        async function handleDiscordCallback(accessToken) {
            try {
                const response = await fetch('https://discord.com/api/users/@me', {
                    headers: {
                        Authorization: `Bearer ${accessToken}`
                    }
                });

                if (!response.ok) throw new Error('Failed to fetch user data');

                const userData = await response.json();
                
                currentUser = {
                    username: userData.username,
                    userId: userData.id,
                    globalName: userData.global_name || userData.username,
                    avatar: userData.avatar 
                        ? `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png`
                        : `https://cdn.discordapp.com/embed/avatars/${(parseInt(userData.discriminator) || 0) % 5}.png`,
                    isAdmin: ADMIN_USERS.includes(userData.username),
                    ownedProducts: [],
                    robloxUsername: null,
                    registeredAt: new Date().toISOString()
                };

                await saveUserData();
                localStorage.setItem('currentUser', JSON.stringify(currentUser));

                window.history.replaceState(null, null, window.location.pathname);
                
                showMainApp();
            } catch (error) {
                console.error('Discord auth error:', error);
                alert('Login failed. Please try again.');
                window.location.href = window.location.pathname;
            }
        }

        async function saveUserData() {
            try {
                const users = JSON.parse(localStorage.getItem('allUsers') || '{}');
                users[currentUser.userId] = currentUser;
                localStorage.setItem('allUsers', JSON.stringify(users));
            } catch (error) {
                console.error('Error saving user data:', error);
            }
        }

        async function loadUserData() {
            try {
                const users = JSON.parse(localStorage.getItem('allUsers') || '{}');
                const savedUser = users[currentUser.userId];
                if (savedUser) {
                    currentUser.ownedProducts = savedUser.ownedProducts || [];
                    currentUser.robloxUsername = savedUser.robloxUsername || null;
                    currentUser.isAdmin = ADMIN_USERS.includes(currentUser.username);
                }
            } catch (error) {
                console.error('Error loading user data:', error);
            }
        }

        function userOwnsProduct(productId) {
            if (currentUser.isAdmin) return true;
            return currentUser.ownedProducts && currentUser.ownedProducts.includes(productId);
        }

        async function purchaseProduct(productId, gamepassUrl) {
            if (!gamepassUrl) return;
            
            window.open(gamepassUrl, '_blank');
            
            const robloxUsername = prompt('Enter your Roblox username to verify purchase:');
            if (!robloxUsername) return;
            
            const product = PRODUCTS.find(p => p.id === productId);
            if (!product || !product.gamepassId) return;
            
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Verifying...';
            
            try {
                const hasGamepass = await checkGamepassOwnership(robloxUsername, product.gamepassId);
                
                if (hasGamepass) {
                    if (!currentUser.ownedProducts) {
                        currentUser.ownedProducts = [];
                    }
                    
                    if (!currentUser.ownedProducts.includes(productId)) {
                        currentUser.ownedProducts.push(productId);
                        currentUser.robloxUsername = robloxUsername;
                        await saveUserData();
                        localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    }
                    
                    alert('✅ Purchase verified! You can now download this product.');
                    renderProducts();
                } else {
                    alert('❌ Purchase not verified. Please make sure you purchased the gamepass and entered the correct Roblox username.');
                }
            } catch (error) {
